<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>體育課成績登記・小一</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --mute:#667085; --line:#d9dee5; --brand:#2455d6; --brand-d:#1b43ad;
  --g4:#0e7490; --g3:#16a34a; --g2:#d97706; --g1:#dc2626; --abs:#8a94a3;
  --g4t:#d9f1f6; --g3t:#dcf5e3; --g2t:#fdeccd; --g1t:#fde0e0; --abst:#e8ebef;
  --r:12px; --tap:48px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;padding-bottom:70px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:var(--tap);min-width:var(--tap);padding:0 14px;touch-action:manipulation}
button:active{filter:brightness(.93)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.danger{color:var(--g1);border-color:#f2b8b8}
button[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=date],input[type=text],input[type=password],input[type=number],textarea{min-height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;max-width:100%}
[hidden]{display:none!important}

/* ── 頂列 ── */
#top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.bar{display:flex;gap:8px;align-items:center;padding:6px 12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;font-weight:600;border-bottom:3px solid transparent;border-radius:0;color:var(--mute)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.grow{flex:1}
.row{display:flex;gap:8px;align-items:center;padding:4px 12px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:0 16px;background:#fff}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
#regFilters{padding:8px 0 0}
.goal{margin:2px 12px 8px;padding:8px 12px;background:#eef3ff;border:1px solid #cfdcff;border-radius:var(--r)}
.goal b{font-size:1.08rem}
.thr{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.88rem;font-weight:600;background:var(--abst);color:#333}
.pill.g4,.badge.g4{background:var(--g4t);color:var(--g4)} .pill.g3,.badge.g3{background:var(--g3t);color:#117a37}
.pill.g2,.badge.g2{background:var(--g2t);color:#a35a00} .pill.g1,.badge.g1{background:var(--g1t);color:var(--g1)}

/* ── 進度與工具 ── */
.prog{margin:10px 12px 6px}
.progtxt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
.meter{height:10px;border-radius:6px;background:#e3e7ec;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 12px}
.tools button.on{background:#fff3cd;border-color:#e6c14d}
.timerbar{margin:8px 12px;padding:8px 12px;border-radius:var(--r);background:#1f2933;color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timerbar .clock{font:700 1.8rem/1 ui-monospace,Menlo,Consolas,monospace;min-width:5.2em}

/* ── 學生卡片 ── */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;padding:0 12px}
@media (max-width:480px){#grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:var(--r);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.card.g4{border-left-color:var(--g4);background:linear-gradient(90deg,var(--g4t),#fff 55%)}
.card.g3{border-left-color:var(--g3);background:linear-gradient(90deg,var(--g3t),#fff 55%)}
.card.g2{border-left-color:var(--g2);background:linear-gradient(90deg,var(--g2t),#fff 55%)}
.card.g1{border-left-color:var(--g1);background:linear-gradient(90deg,var(--g1t),#fff 55%)}
.card.abs{border-left-color:var(--abs);background:var(--abst)}
.card[data-hide]{display:none}
.chead{display:flex;align-items:center;gap:8px}
.seat{font:700 1.15rem/1 ui-monospace,Menlo,Consolas,monospace;background:#e8edf5;border-radius:8px;padding:6px 8px;min-width:2.4em;text-align:center}
.sname{font-size:1.2rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-weight:700;border-radius:8px;padding:4px 10px;background:var(--abst);color:var(--mute);min-width:3.4em;text-align:center}
.ic{padding:0 10px;font-size:.95rem}
.ic.abs.on{background:var(--abs);color:#fff;border-color:var(--abs)}
.ic.note.has{background:#fff3cd;border-color:#e6c14d}
.cbody{display:flex;flex-direction:column;gap:8px}
.card.abs .cbody{opacity:.35;pointer-events:none}
.num{display:flex;gap:8px;align-items:stretch}
.num input{flex:1;min-width:0;text-align:center;font-size:1.7rem;font-weight:700;min-height:56px}
.num button{font-size:1.4rem;font-weight:700;min-width:60px;min-height:56px}
.quick{display:flex;gap:6px}
.quick button{flex:1;font-size:.92rem;padding:0 4px}
.quick .q4{border-color:var(--g4);color:var(--g4)} .quick .q3{border-color:var(--g3);color:#117a37} .quick .q2{border-color:var(--g2);color:#a35a00}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lv button{flex-direction:column;padding:4px 2px;font-size:.92rem;line-height:1.2;min-height:60px}
.lv button.on.g4{background:var(--g4);color:#fff;border-color:var(--g4)} .lv button.on.g3{background:var(--g3);color:#fff;border-color:var(--g3)}
.lv button.on.g2{background:var(--g2);color:#fff;border-color:var(--g2)} .lv button.on.g1{background:var(--g1);color:#fff;border-color:var(--g1)}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck button{text-align:left;padding:6px 10px;line-height:1.25;min-height:54px;display:flex;align-items:center;gap:6px}
.ck button::before{content:"";flex:none;width:22px;height:22px;border:2px solid #9aa5b4;border-radius:6px;background:#fff}
.ck button.on{background:#e8f6ec;border-color:var(--g3)}
.ck button.on::before{background:var(--g3);border-color:var(--g3);content:"✓";color:#fff;text-align:center;line-height:18px;font-weight:700}
.noterow input{width:100%}
.stamp{display:none;background:#1f2933;color:#fff;font-size:1.2rem;min-height:60px}
.timing .stamp{display:block}
.timing .num,.timing .quick{display:none}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}

/* ── 總覽 ── */
#viewOv{padding:8px 12px 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:1.05rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;align-items:center;gap:4px;font-size:.9rem;color:var(--mute)}
.dist{display:flex;height:30px;border-radius:8px;overflow:hidden;background:#e3e7ec}
.dist>span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;min-width:0;overflow:hidden}
.dist .g4{background:var(--g4)} .dist .g3{background:var(--g3)} .dist .g2{background:var(--g2)} .dist .g1{background:var(--g1)}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px;margin-top:10px}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:2px 8px;align-items:center;font-size:.92rem}
.rate .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate .bar2{grid-column:1/-1;height:8px;background:#e3e7ec;border-radius:5px;overflow:hidden}
.rate .bar2 i{display:block;height:100%;background:var(--g3)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{min-height:44px}
.heat-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table.heat{border-collapse:separate;border-spacing:0;font-size:.9rem}
.heat th,.heat td{border-right:1px solid #edf0f3;border-bottom:1px solid #edf0f3;text-align:center;padding:0}
.heat thead th{position:sticky;background:#f0f3f8;z-index:2;font-weight:600;padding:4px 4px}
.heat thead tr:nth-child(1) th{top:0;height:32px}
.heat thead tr:nth-child(2) th{top:32px;min-width:64px;max-width:84px;font-size:.78rem;line-height:1.15;vertical-align:bottom}
.heat .sticky1{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:128px;padding:0 8px;white-space:nowrap}
.heat thead .sticky1{z-index:5;background:#f0f3f8}
.heat td.cell{height:44px;min-width:64px;font-weight:700;cursor:pointer}
.cell.g4{background:var(--g4t);color:var(--g4)} .cell.g3{background:var(--g3t);color:#117a37}
.cell.g2{background:var(--g2t);color:#a35a00} .cell.g1{background:var(--g1t);color:var(--g1)}
.cell.abs{background:var(--abst);color:var(--mute);font-weight:400;font-size:.8rem}
.cell.none{color:#c3cad4;font-weight:400}
.heat td.avg{background:#f7f8fb;min-width:58px;font-weight:700;border-left:2px solid #c9d1de}
.heat tr.rowflag .sticky1{color:var(--g1);font-weight:700}
.heat .sno{display:inline-block;width:1.8em;color:var(--mute);font-weight:400}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

/* ── 抽屜、對話框、通知 ── */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:60;box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:12px}
#drawer.open{transform:none}
#drawer h2{margin:0 0 6px}
.dact{border-top:1px solid var(--line);padding:8px 0}
.dact .hd{display:flex;gap:8px;align-items:center;font-weight:600}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hist .pill small{font-weight:400;color:#333}
.trend{margin-left:auto;font-size:.9rem}
.up{color:var(--g3)} .down{color:var(--g1)} .flat{color:var(--mute)}
#modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:16px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}
#modal h2{margin:0 0 8px;font-size:1.2rem}
#modal .fld{display:flex;flex-direction:column;gap:4px;margin:10px 0}
#modal .fld input{width:100%}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--g1);font-size:.92rem;min-height:1.3em}
#sync{position:fixed;right:10px;bottom:10px;z-index:70;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:.92rem;font-weight:600}
#sync.ok{color:#117a37} #sync.pend{color:#a35a00;border-color:#e6c14d} #sync.off{color:#fff;background:#667085;border-color:#667085} #sync.bad{color:var(--g1);border-color:#f2b8b8}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1f2933;color:#fff;border-radius:10px;padding:8px 14px;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}

@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;padding:0;font-size:11px}
  #top,#viewReg,#sync,#toast,#drawer,#modal,.noprint{display:none!important}
  #viewOv{display:block!important;padding:0}
  .panel{break-inside:avoid;border-color:#bbb}
  .heat-wrap{overflow:visible;max-height:none}
  .heat thead th,.heat .sticky1{position:static}
  table.heat{font-size:10px}
  .heat td.cell{height:22px;min-width:34px}
  .heat thead tr:nth-child(2) th{min-width:34px;max-width:50px;font-size:8px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="top">
  <div class="bar">
    <nav class="tabs"><button data-view="reg" class="on">登記</button><button data-view="ov">總覽</button></nav>
    <span class="grow"></span>
    <button id="btnRefresh" title="重新載入名單、活動與成績" aria-label="重新整理">↻</button>
    <button id="btnMenu" title="設定" aria-label="設定">⚙</button>
  </div>
  <div id="regHead"></div>
</header>

<main id="viewReg">
  <div id="regFilters"></div>
  <div id="progress"></div>
  <div id="tools"></div>
  <div id="timer"></div>
  <div id="grid"></div>
</main>
<main id="viewOv" hidden></main>

<aside id="drawer" aria-label="學生詳情"></aside>
<div id="sync" class="pend">載入中…</div>
<div id="toast"></div>
<div id="modal" hidden></div>

<script>
(() => {
'use strict';

/* ════════ 設定 ════════
 * 後端網址：部署 Apps Script 後，把「網頁應用程式網址」貼在下面引號內，所有裝置就不用再輸入。
 * 留空也可以：第一次開啟時網頁會請您輸入，並記在這台裝置。
 * 這是網址而非機密；真正的保護是「教師通行碼」。請勿把學生名單提交進 GitHub。 */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwJqsm_tSxg2t7Tgl6D5l-WkCCS4rmNck-rxWQP-AC64rc6OxrfHxm3cIdDqEsTbos-/exec';

/* 等級換算成績（落在 85–100 分）：優=100、達成=93、接近=89、需加油=85。缺席不計。可直接改這裡的數字。 */
const SCORE_MAP = { 4: 100, 3: 93, 2: 89, 1: 85 };
const scoreOf = g => (g ? SCORE_MAP[g] : null);
const fmtScore = n => (n == null ? '–' : String(Math.round(n * 10) / 10));

const LS = { auth: 'pe1.auth', cache: 'pe1.cache', queue: 'pe1.queue', ui: 'pe1.ui' };
const LV = { 4: { t: '優', full: '優異', icon: '🌟' }, 3: { t: '達成', full: '達成', icon: '👍' }, 2: { t: '接近', full: '接近', icon: '🙂' }, 1: { t: '需加油', full: '需加油', icon: '💪' } };

const $ = (s, r = document) => r.querySelector(s);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 隱私模式 */ } };
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const k in a) {
    const v = a[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(2)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const K = (date, cls, no, aid) => `${date}|${cls}|${no}|${aid}`;
const fmt1 = n => (n == null ? '–' : (Math.round(n * 10) / 10).toString());
const fmtMD = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

/* ════════ 狀態 ════════ */
const S = {
  cfg: { activities: [], units: [], categories: [] }, classes: {}, classOrder: [],
  scores: new Map(),              // key → rec {date,cls,no,aid,value,grade,absent,note,detail}
  queue: new Map(),               // key → {rec, seq}  待送出
  seq: 0, syncing: false, online: navigator.onLine !== false, lastErr: '', booted: false, loading: false
};
let auth = lsGet(LS.auth, { url: '', key: '' });
const ui = Object.assign({
  view: 'reg', cls: '', date: todayStr(), cat: '', unit: '', aid: '', onlyTodo: false,
  o: { cat: '', unit: '', from: '', to: '', sort: 'seat', aid: '' }
}, lsGet(LS.ui, {}));
ui.date = todayStr();            // 每次開啟預設今天
ui.onlyTodo = false;
const saveUi = () => lsSet(LS.ui, ui);
const timer = { t0: null, tick: null };

/* ════════ 等級規則（與 Code.gs 相同） ════════ */
function gradeOf(act, v) {
  if (v == null || v === '' || isNaN(v) || !act) return null;
  v = Number(v);
  if (act.mode === 'level') return Math.min(4, Math.max(1, Math.round(v)));
  if (act.t4 == null || act.t3 == null || act.t2 == null) return null;
  if (act.dir === '低') return v <= act.t4 ? 4 : v <= act.t3 ? 3 : v <= act.t2 ? 2 : 1;
  return v >= act.t4 ? 4 : v >= act.t3 ? 3 : v >= act.t2 ? 2 : 1;
}
const actById = id => S.cfg.activities.find(a => a.id === id);
const enabledActs = () => S.cfg.activities.filter(a => a.on);
const done = r => !!r && (r.absent || r.grade != null);
const students = () => S.classes[ui.cls] || [];
const unitLabel = id => { if (!id) return '不屬於單元'; const u = S.cfg.units.find(x => x.id === id); return u ? `${u.id} ${u.name}` : id; };
const catsWithActs = () => S.cfg.categories.filter(c => enabledActs().some(a => a.cat === c));
function thrText(a) {
  if (a.mode === 'level') return [['g4', '🌟優異'], ['g3', '👍達成'], ['g2', '🙂接近'], ['g1', '💪需加油']];
  if (a.t4 == null) return [];
  const op = a.mode === 'checklist' ? '≥' : (a.dir === '低' ? '≤' : '≥');
  const u = a.mode === 'checklist' ? '項' : a.uom;
  return [['g4', `優 ${op}${a.t4}${u}`], ['g3', `達成 ${op}${a.t3}${u}`], ['g2', `接近 ${op}${a.t2}${u}`]];
}

/* ════════ 本機快取與同步佇列 ════════ */
const toRow = r => [r.date, r.cls, r.no, r.aid, r.value, r.grade, r.absent ? 1 : 0, r.note || '', r.detail || ''];
const fromRow = a => ({ date: a[0], cls: String(a[1]), no: Number(a[2]), aid: String(a[3]), value: a[4], grade: a[5], absent: !!a[6], note: a[7] || '', detail: a[8] || '' });
let cacheTimer = 0;
function saveCacheSoon() { clearTimeout(cacheTimer); cacheTimer = setTimeout(saveCache, 800); }
function saveCache() {
  clearTimeout(cacheTimer);
  lsSet(LS.cache, { cfg: S.cfg, classes: S.classes, classOrder: S.classOrder, scores: [...S.scores.values()].map(toRow), at: Date.now() });
}
const saveQueue = () => lsSet(LS.queue, [...S.queue.values()]);

function enqueue(key, rec) {
  S.queue.set(key, { rec, seq: ++S.seq });
  saveQueue(); saveCacheSoon(); scheduleFlush(1200); renderSync();
}
let flushTimer = 0, retryDelay = 0;
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }

async function callApi(body, opts = {}) {
  const url = DEFAULT_API || auth.url;
  if (!url) throw new Error('尚未設定後端網址');
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), opts.timeout || 25000);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key: auth.key }), signal: ctl.signal, redirect: 'follow', keepalive: !!opts.keepalive });
    if (!r.ok) throw new Error('伺服器回應 ' + r.status);
    return await r.json();
  } finally { clearTimeout(to); }
}

async function flush() {
  clearTimeout(flushTimer);
  if (S.syncing || !S.queue.size) { renderSync(); return; }
  if (!S.online) { renderSync(); return; }
  S.syncing = true; renderSync();
  const batch = [...S.queue.entries()].slice(0, 300);
  let ok = false;
  try {

}

    const act = actById(r.aid);
    S.scores.set(key, { date: r.date, cls: String(r.cls), no: r.no, aid: r.aid, value: r.absent ? null : r.value, grade: r.absent ? null : gradeOf(act, r.value), absent: !!r.absent, note: r.note || '', detail: r.detail || '' });

  S.loading = true; renderSync();
  try {
    const j = await callApi({ action: 'bootstrap' });

    if (!j.ok) throw new Error(j.error || '載入失敗');

function startTimer() {

  const bar = h('div', { class: 'timerbar' }, h('span', null, '計時中'), h('span', { class: 'clock' }, '0.0'), h('span', null, '學生衝線／停止時，點他卡片上的大按鈕'));
  $('#timer').replaceChildren(bar);
  timer.tick = setInterval(() => { bar.querySelector('.clock').textContent = ((performance.now() - timer.t0) / 1000).toFixed(1); }, 100);
  $('#grid').classList.add('timing'); renderTools();
}
function stopTimer() {
  if (!timer.t0 && !timer.tick) return;
  clearInterval(timer.tick); timer.t0 = null; timer.tick = null;
  $('#timer').replaceChildren(); $('#grid').classList.remove('timing'); renderTools();
}

/* ════════ 總覽頁 ════════ */
function ovCompute() {
  const o = ui.o, list = students(), nos = new Set(list.map(s => s[0]));
  const acts = enabledActs().filter(a => (!o.cat || a.cat === o.cat) && (!o.unit || (o.unit === '__none' ? !a.unit : a.unit === o.unit)));
  const byId = new Map(acts.map(a => [a.id, a]));
  const latest = new Map(), touched = new Map(), absOnly = new Map();     // latest: no → Map(aid → rec)
  for (const r of S.scores.values()) {
    if (r.cls !== ui.cls || !nos.has(r.no) || !byId.has(r.aid)) continue;
    if ((o.from && r.date < o.from) || (o.to && r.date > o.to)) continue;
    if (!touched.has(r.aid)) touched.set(r.aid, new Set()); touched.get(r.aid).add(r.no);
    if (r.grade == null) { if (r.absent) { if (!absOnly.has(r.no)) absOnly.set(r.no, new Set()); absOnly.get(r.no).add(r.aid); } continue; }
    let m = latest.get(r.no); if (!m) latest.set(r.no, m = new Map());
    const prev = m.get(r.aid); if (!prev || r.date > prev.date) m.set(r.aid, r);
  }
  const cols = acts.filter(a => touched.has(a.id));
  const colCats = []; for (const a of cols) if (!colCats.includes(a.cat)) colCats.push(a.cat);
  colCats.sort((x, y) => S.cfg.categories.indexOf(x) - S.cfg.categories.indexOf(y));
  const ordered = colCats.flatMap(c => cols.filter(a => a.cat === c));
  const rows = list.map(([no, name]) => {
    const m = latest.get(no) || new Map();
    const gs = ordered.map(a => m.has(a.id) ? m.get(a.id).grade : null);
    const all = gs.filter(g => g != null);
    const catAvg = colCats.map(c => mean(ordered.map((a, i) => a.cat === c ? gs[i] : null).filter(g => g != null)));
    const score = mean(all.map(scoreOf)), avg = mean(all), ones = all.filter(g => g === 1).length;
    return { no, name, gs, catAvg, avg, score, ones, flag: all.length > 0 && (avg < 2 || ones >= 2), abs: absOnly.get(no) || new Set() };
  });
  return { list, acts, ordered, colCats, rows, touched };
}

function renderOverview() {
  const box = $('#viewOv'), o = ui.o;
  if (!S.classOrder.length) { box.replaceChildren(h('div', { class: 'empty' }, '尚無班級資料。')); return; }
  const D = ovCompute();
  const clsSel = h('select', { 'aria-label': '班級', onchange: e => { ui.cls = e.target.value; saveUi(); renderAll(); } }, S.classOrder.map(c => h('option', { value: c, selected: c === ui.cls }, c)));
  const catSel = h('select', { 'aria-label': '類別', onchange: e => { o.cat = e.target.value; renderOverview(); } }, h('option', { value: '' }, '全部類別'), catsWithActs().map(c => h('option', { value: c, selected: o.cat === c }, c)));
  const unitIds = [...new Set(enabledActs().map(a => a.unit))];
  const unitSel = h('select', { 'aria-label': '單元', onchange: e => { o.unit = e.target.value; renderOverview(); } }, h('option', { value: '' }, '全部單元'),
    unitIds.filter(Boolean).sort(unitSort).map(u => h('option', { value: u, selected: o.unit === u }, unitLabel(u))), unitIds.includes('') ? h('option', { value: '__none', selected: o.unit === '__none' }, '不屬於單元') : null);
  const from = h('input', { type: 'date', value: o.from, 'aria-label': '起日', onchange: e => { o.from = e.target.value; renderOverview(); } });
  const to = h('input', { type: 'date', value: o.to, 'aria-label': '迄日', onchange: e => { o.to = e.target.value; renderOverview(); } });
  const sortSel = h('select', { 'aria-label': '排序', onchange: e => { o.sort = e.target.value; renderOverview(); } },
    [['seat', '依座號'], ['need', '需關注在前'], ['best', '表現好在前']].map(([v, t]) => h('option', { value: v, selected: o.sort === v }, t)));

  // 分布與達成率
  const cells = D.rows.flatMap(r => r.gs.filter(g => g != null));
  const tot = cells.length, cnt = g => cells.filter(x => x === g).length, avgAll = mean(cells);
  const dist = h('div', { class: 'dist', role: 'img', 'aria-label': '全班等級分布' }, [4, 3, 2, 1].map(g => cnt(g) ? h('span', { class: 'g' + g, style: `flex:${cnt(g)}` }, `${LV[g].t} ${cnt(g)}`) : null));
  const rates = D.ordered.map((a, i) => {
    const gs = D.rows.map(r => r.gs[i]).filter(g => g != null), ok = gs.filter(g => g >= 3).length;
    const p = gs.length ? Math.round(ok / gs.length * 100) : 0;
    return h('div', { class: 'rate', title: `${a.name}：${ok}/${gs.length}` }, h('span', { class: 'nm' }, `${a.icon} ${a.name}`), h('b', null, gs.length ? p + '%' : '–'),
      h('div', { class: 'bar2' }, h('i', { style: `width:${p}%` })));
  });
  const p1 = h('div', { class: 'panel' }, h('h3', null, `全班狀況　平均等級 ${fmt1(avgAll)}　平均成績 ${fmtScore(mean(cells.map(scoreOf)))} 分（共 ${tot} 筆）`),
    tot ? dist : h('div', { class: 'empty', style: 'padding:12px' }, '這個篩選條件下還沒有成績'),
    D.ordered.length ? [h('h3', { style: 'margin:12px 0 0' }, '各活動達成率（等級 ≥ 3）'), h('div', { class: 'rates' }, rates)] : null);

  // 需要關注
  const flagged = D.rows.filter(r => r.flag).sort((a, b) => a.avg - b.avg);
  const p2 = h('div', { class: 'panel' }, h('h3', null, `需要關注（${flagged.length}）　平均低於 2，或 2 項以上只得 1 級`),
    flagged.length ? h('div', { class: 'names' }, flagged.map(r => h('button', { onclick: () => openDrawer(r.no) }, `${r.no} ${r.name}｜平均 ${fmt1(r.avg)}｜需加油 ${r.ones} 項`))) : h('span', { style: 'color:var(--mute)' }, '目前沒有需要特別關注的學生 👍'));

  // 尚未登記
  const actsForPick = D.acts;
  if (!actsForPick.some(a => a.id === o.aid)) o.aid = actsForPick[0] ? actsForPick[0].id : '';
  const pick = h('select', { 'aria-label': '選擇活動', onchange: e => { o.aid = e.target.value; renderOverview(); } }, actsForPick.map(a => h('option', { value: a.id, selected: a.id === o.aid }, `${a.icon} ${a.name}`)));
  const have = D.touched.get(o.aid) || new Set(), missing = D.list.filter(([no]) => !have.has(no));
  const p3 = h('div', { class: 'panel' }, h('h3', null, '尚未登記'), h('div', { class: 'row', style: 'padding:0 0 8px' }, pick, h('span', { class: 'pill' }, `${missing.length} 人`)),
    missing.length ? h('div', { class: 'names' }, missing.map(([no, name]) => h('span', { class: 'pill', style: 'padding:6px 12px;font-size:.95rem' }, `${no} ${name}`))) : h('span', { style: 'color:var(--mute)' }, '全班都已登記 ✓'));

  // 熱力圖
  const rows = D.rows.slice();
  if (o.sort === 'need') rows.sort((a, b) => (a.avg ?? 99) - (b.avg ?? 99) || a.no - b.no);
  else if (o.sort === 'best') rows.sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1) || a.no - b.no);
  const grp = D.colCats.map(c => h('th', { colspan: D.ordered.filter(a => a.cat === c).length }, c));
  const thead = h('thead', null,
    h('tr', null, h('th', { class: 'sticky1', rowspan: 2 }, '座號 姓名'), grp, h('th', { colspan: D.colCats.length + 2, style: 'border-left:2px solid #c9d1de' }, '平均與成績')),
    h('tr', null, D.ordered.map(a => h('th', { title: a.goal }, `${a.icon}${a.name.length > 9 ? a.name.slice(0, 9) + '…' : a.name}`)),
      D.colCats.map((c, i) => h('th', { style: i === 0 ? 'border-left:2px solid #c9d1de' : '' }, c)), h('th', null, '總平均'), h('th', null, '成績(分)')));
  const tbody = h('tbody', null, rows.map(r => h('tr', { class: r.flag ? 'rowflag' : '' },
    h('td', { class: 'sticky1', onclick: () => openDrawer(r.no), style: 'cursor:pointer' }, h('span', { class: 'sno' }, r.no), r.name),
    r.gs.map((g, i) => {
      const a = D.ordered[i], ab = g == null && r.abs.has(a.id);
      return h('td', { class: 'cell ' + (g ? 'g' + g : ab ? 'abs' : 'none'), onclick: () => openDrawer(r.no), title: `${r.name}・${a.name}` }, g ? g : ab ? '缺' : '·');
    }),
    r.catAvg.map((v, i) => h('td', { class: 'avg', style: i === 0 ? '' : 'border-left:1px solid #edf0f3' }, fmt1(v))),
    h('td', { class: 'avg', style: 'border-left:1px solid #edf0f3' }, h('b', null, fmt1(r.avg))),
    h('td', { class: 'avg', style: 'background:#eef6ff' }, h('b', null, fmtScore(r.score))))));
  const colAvg = h('tr', null, h('td', { class: 'sticky1', style: 'font-weight:700' }, '全班平均'),
    D.ordered.map((a, i) => h('td', { class: 'avg', style: 'border-left:0' }, fmt1(mean(D.rows.map(r => r.gs[i]).filter(g => g != null))))),
    D.colCats.map((c, i) => h('td', { class: 'avg', style: i === 0 ? '' : 'border-left:1px solid #edf0f3' }, fmt1(mean(D.rows.map(r => r.catAvg[i]).filter(v => v != null))))),
    h('td', { class: 'avg', style: 'border-left:1px solid #edf0f3' }, h('b', null, fmt1(mean(D.rows.map(r => r.avg).filter(v => v != null))))),
    h('td', { class: 'avg', style: 'background:#eef6ff' }, h('b', null, fmtScore(mean(D.rows.map(r => r.score).filter(v => v != null))))));
  tbody.append(colAvg);
  const legend = h('div', { class: 'legend' }, [4, 3, 2, 1].map(g => h('span', { class: 'pill g' + g }, `${g} ${LV[g].t}`)), h('span', { class: 'pill' }, '缺＝缺席　·＝未登記　同一活動取最近一次出席成績'));
  const p4 = h('div', { class: 'panel' }, h('h3', null, '熱力圖'), legend,
    D.ordered.length ? h('div', { class: 'heat-wrap' }, h('table', { class: 'heat' }, thead, tbody)) : h('div', { class: 'empty', style: 'padding:12px' }, '尚無資料'));

  box.replaceChildren(
    h('div', { class: 'panel noprint' }, h('div', { class: 'filters' }, clsSel, catSel, unitSel, h('label', null, '從', from), h('label', null, '到', to), sortSel,
      h('span', { class: 'grow' }), h('button', { onclick: () => window.print() }, '🖨 列印'), h('button', { onclick: exportCsv }, '⬇ 匯出 CSV'))),
    p1, p2, p3, p4);
}

function exportCsv() {
  const o = ui.o, nm = new Map(students());
  const rows = [['班級', '座號', '姓名', '日期', '類別', '單元', '活動', '原始數值', '單位', '等級', '分數', '缺席', '備註']];
  const recs = [...S.scores.values()].filter(r => r.cls === ui.cls && (!o.from || r.date >= o.from) && (!o.to || r.date <= o.to) && actById(r.aid)).sort((a, b) => a.no - b.no || a.date.localeCompare(b.date));
  for (const r of recs) {
    const a = actById(r.aid);
    if (o.cat && a.cat !== o.cat) continue;
    rows.push([r.cls, r.no, nm.get(r.no) || '', r.date, a.cat, a.unit, a.name, r.value ?? '', a.mode === 'level' ? '' : a.uom, r.grade ?? '', scoreOf(r.grade) ?? '', r.absent ? '缺席' : '', r.note]);
  }
  const csv = '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `體育成績_${ui.cls}_${todayStr()}.csv` });
  document.body.append(a); a.click(); a.remove(); toast(`已匯出 ${rows.length - 1} 筆`);
}

/* 學生詳情抽屜 */
function openDrawer(no) {
  const nm = students().find(s => s[0] === no); if (!nm) return;
  const recs = [...S.scores.values()].filter(r => r.cls === ui.cls && r.no === no && actById(r.aid)).sort((a, b) => a.date.localeCompare(b.date));
  const byAct = new Map(); for (const r of recs) { if (!byAct.has(r.aid)) byAct.set(r.aid, []); byAct.get(r.aid).push(r); }
  const acts = [...byAct.keys()].map(actById).sort((a, b) => S.cfg.categories.indexOf(a.cat) - S.cfg.categories.indexOf(b.cat));
  const lastGs = acts.map(a => { const g = byAct.get(a.id).filter(r => r.grade != null); return g.length ? g[g.length - 1].grade : null; }).filter(g => g != null);
  const d = $('#drawer');
  d.replaceChildren(
    h('div', { style: 'display:flex;align-items:center;gap:8px' }, h('h2', { style: 'flex:1' }, `${no} 號 ${nm[1]}`), h('button', { onclick: () => d.classList.remove('open'), 'aria-label': '關閉' }, '✕')),
    h('div', { class: 'legend' }, h('span', { class: 'pill' }, `${ui.cls}`), h('span', { class: 'pill' }, `平均等級 ${fmt1(mean(lastGs))}`), h('span', { class: 'pill g4' }, `成績 ${fmtScore(mean(lastGs.map(scoreOf)))} 分`), h('span', { class: 'pill' }, `${acts.length} 個活動`)),
    ...(acts.length ? acts.map(a => {
      const rs = byAct.get(a.id), gs = rs.filter(r => r.grade != null).map(r => r.grade);
      let tr = null;
      if (gs.length >= 2) { const dt = gs[gs.length - 1] - gs[0]; tr = dt > 0 ? h('span', { class: 'trend up' }, `↗ 進步（${gs.join('→')}）`) : dt < 0 ? h('span', { class: 'trend down' }, `↘ 退步（${gs.join('→')}）`) : h('span', { class: 'trend flat' }, `→ 持平（${gs.join('→')}）`); }
      return h('div', { class: 'dact' }, h('div', { class: 'hd' }, `${a.icon} ${a.name}`, h('small', { style: 'color:var(--mute);font-weight:400' }, a.cat), tr),
        h('div', { class: 'hist' }, rs.map(r => h('span', { class: 'pill ' + (r.absent ? '' : 'g' + r.grade), title: r.note || '' },
          fmtMD(r.date), ' ', r.absent ? '缺席' : (a.mode === 'level' ? LV[r.grade].full : h('small', null, `${r.value}${a.mode === 'checklist' ? '項' : a.uom} `), LV[r.grade] ? LV[r.grade].t : ''), r.note ? ' 📝' : ''))),
        rs.filter(r => r.note).map(r => h('div', { style: 'font-size:.88rem;color:var(--mute);margin-top:4px' }, `${fmtMD(r.date)} 備註：${r.note}`)));
    }) : [h('div', { class: 'empty' }, '還沒有這位學生的成績')]));
  d.classList.add('open');
}

/* ════════ 切換與啟動 ════════ */
function renderAll() {
  ensureSelection(); saveUi();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === ui.view));
  const reg = ui.view === 'reg';
  $('#viewReg').hidden = !reg; $('#viewOv').hidden = reg; $('#regHead').hidden = !reg;
  if (reg) renderRegAll(); else renderOverview();
  renderSync();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { ui.view = b.dataset.view; $('#drawer').classList.remove('open'); stopTimer(); renderAll(); }));
$('#btnRefresh').addEventListener('click', () => bootstrap(true));
$('#btnMenu').addEventListener('click', showMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });

(function init() {
  const m = /[#&]api=([^&]+)/.exec(location.hash);          // 可用 …/index.html#api=網址 一次設定新裝置
  if (m) { try { auth.url = decodeURIComponent(m[1]); lsSet(LS.auth, auth); history.replaceState(null, '', location.pathname + location.search); } catch { } }
  for (const q of lsGet(LS.queue, [])) if (q && q.rec) { const r = q.rec; S.queue.set(K(r.date, r.cls, r.no, r.aid), { rec: r, seq: ++S.seq }); }
  const cached = loadCache();
  renderAll();
  if (!cached) $('#grid').replaceChildren(h('div', { class: 'empty' }, '載入中…'));
  bootstrap();
  if (S.queue.size) scheduleFlush(1500);
})();

window.__pe = { S, ui, flush, bootstrap, gradeOf, SCORE_MAP };      // 供除錯與自動測試
})();
