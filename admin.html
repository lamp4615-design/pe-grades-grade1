<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>教師後台・體育成績</title>
<style>
:root{--bg:#f4f6f8;--ink:#1f2933;--mute:#667085;--line:#d9dee5;--brand:#2455d6;
  --g4:#0e7490;--g3:#16a34a;--g2:#d97706;--g1:#dc2626;--g4t:#d9f1f6;--g3t:#dcf5e3;--g2t:#fdeccd;--g1t:#fde0e0;--abst:#e8ebef;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:0 14px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
select,input[type=date],input[type=text],input[type=password],input[type=search]{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;max-width:100%}
[hidden]{display:none!important}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap}
.top h1{font-size:1.1rem;margin:0 8px 0 0}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 8px;border-top:1px solid #eef0f3}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mute);font-weight:600;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.grow{flex:1}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters label{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:.88rem}
main{max-width:1240px;margin:0 auto;padding:14px 16px 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:1.02rem;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{color:var(--mute);font-weight:400}
.grid{display:grid;gap:12px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-cls{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.kpi .v{font-size:1.9rem;font-weight:800;line-height:1.15}
.kpi .l{color:var(--mute);font-size:.86rem}
.kpi .s{font-size:.8rem;color:var(--mute)}
.insight{margin:0 0 14px;padding:12px 16px;background:#eef3ff;border:1px solid #cfdcff;border-radius:var(--r)}
.insight li{margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--abst);color:#333;white-space:nowrap}
.g4{--c:var(--g4);--t:var(--g4t)} .g3{--c:var(--g3);--t:var(--g3t)} .g2{--c:var(--g2);--t:var(--g2t)} .g1{--c:var(--g1);--t:var(--g1t)}
.pill.g4,.pill.g3,.pill.g2,.pill.g1{background:var(--t);color:var(--c)}
.pill.warn{background:#fff3cd;color:#8a5a00} .pill.bad{background:var(--g1t);color:var(--g1)} .pill.good{background:var(--g3t);color:#117a37}
.cc{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:12px;cursor:pointer;text-align:left;min-height:0;display:block;width:100%}
.cc:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(36,85,214,.15)}
.cc .big{font-size:2.2rem;font-weight:800;line-height:1}
.cc .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#e3e7ec;margin-top:8px}
.stack i{display:block;height:100%}
.stack .g4{background:var(--g4)} .stack .g3{background:var(--g3)} .stack .g2{background:var(--g2)} .stack .g1{background:var(--g1)}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:.92rem}
.hbar .t{background:#e3e7ec;border-radius:6px;height:16px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--c,var(--brand))}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.85rem}
.hist i{display:block;width:100%;max-width:80px;background:var(--c);border-radius:6px 6px 0 0;min-height:2px}
.hist b{font-size:1rem}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid #edf0f3;text-align:center;font-size:.92rem}
th{background:#f0f3f8;position:sticky;top:0;z-index:2;font-weight:600;cursor:default}
th.sort{cursor:pointer} th.sort:hover{background:#e4e9f2}
td.l,th.l{text-align:left}
tbody tr:hover td{background:#f8faff}
tr.click{cursor:pointer}
.wrap{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:10px}
.wrap th.s1,.wrap td.s1{position:sticky;left:0;background:#fff;z-index:1;text-align:left;white-space:nowrap}
.wrap th.s1{z-index:3;background:#f0f3f8}
.sc{font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block;min-width:3em;background:var(--t,#eee);color:var(--c,#333)}
.up{color:var(--g3);font-weight:700} .down{color:var(--g1);font-weight:700} .flat{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.person{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f3;flex-wrap:wrap;cursor:pointer}
.person:hover{background:#f8faff}
.person .nm{font-weight:700;min-width:7em}
.empty{padding:28px;text-align:center;color:var(--mute)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:60;box-shadow:-6px 0 24px rgba(0,0,0,.22);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:14px}
#drawer.open{transform:none}
.dact{border-top:1px solid var(--line);padding:8px 0}
.dact .hd{display:flex;gap:8px;align-items:center;font-weight:600;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:#1f2933;color:#fff;border-radius:10px;padding:8px 14px}
.note{color:var(--mute);font-size:.86rem}
@media print{
  @page{size:A4 landscape;margin:10mm}
  header,#drawer,#modal,#toast,.noprint{display:none!important}
  body{background:#fff;font-size:11px} main{max-width:none;padding:0}
  .wrap{overflow:visible;max-height:none;border:0} th{position:static} .wrap th.s1,.wrap td.s1{position:static}
  .panel{border:0;padding:0} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📊 教師後台</h1>
    <div class="filters">
      <select id="fCls" aria-label="班級"></select>
      <label>從<input type="date" id="fFrom"></label>
      <label>到<input type="date" id="fTo"></label>
      <select id="fMode" aria-label="總分算法" title="總分怎麼算">
        <option value="cat">總分＝各類別平均再平均</option>
        <option value="act">總分＝各活動平均</option>
      </select>
    </div>
    <span class="grow"></span>
    <span id="stamp" class="note"></span>
    <button id="btnRefresh" title="重新載入">↻</button>
    <a href="index.html" style="text-decoration:none"><button>← 登記頁</button></a>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="home">班級總覽</button><button data-tab="cls">班級分析</button><button data-tab="stu">學生成績表</button><button data-tab="todo">待處理</button><button data-tab="report">學期成績單</button>
  </nav>
</header>
<main id="main"></main>
<aside id="drawer" aria-label="學生詳情"></aside>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
/* 與 index.html 相同的後端網址與登入資訊（同一個網站，登記頁登入過這裡就直接可用）。 */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwJqsm_tSxg2t7Tgl6D5l-WkCCS4rmNck-rxWQP-AC64rc6OxrfHxm3cIdDqEsTbos-/exec';
const LS = { auth: 'pe1.auth', cache: 'pe1.cache', ui: 'pe1.admin.ui' };
const SCORE_MAP = { 4: 100, 3: 93, 2: 89, 1: 85 };
const LV = { 4: '優', 3: '達成', 2: '接近', 1: '需加油' };

const $ = (s, r = document) => r.querySelector(s);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const k in a) { const v = a[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style') e.setAttribute('style', v); else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, a, ...kids) { const e = document.createElementNS(NS, tag); for (const k in a || {}) e.setAttribute(k, a[k]); for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : String(c)); return e; }
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const f1 = n => n == null ? '–' : (Math.round(n * 10) / 10).toFixed(1);
const f0 = n => n == null ? '–' : String(Math.round(n));
const pct = n => n == null ? '–' : Math.round(n * 100) + '%';
const todayStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
const scoreOf = (act, g) => g ? (act && act.sc ? act.sc[4 - g] : SCORE_MAP[g]) : null;
/* 分數 → 顏色帶（依預設換算 100/93/89/85 的中點切分） */
const band = v => v == null ? '' : v >= 96.5 ? 'g4' : v >= 91 ? 'g3' : v >= 87 ? 'g2' : 'g1';
const bandLabel = v => v == null ? '' : v >= 96.5 ? '優異' : v >= 91 ? '達成' : v >= 87 ? '接近' : '需加油';

/* ════════ 狀態 ════════ */
const S = { cfg: { activities: [], units: [], categories: [] }, classes: {}, classOrder: [], scores: new Map(), ver: 0, at: '' };
let auth = lsGet(LS.auth, { url: '', key: '' });
const st = Object.assign({ tab: 'home', cls: '', from: '', to: '', mode: 'cat', q: '', sk: 'no', sd: 1, onlyFlag: false }, lsGet(LS.ui, {}));
const saveSt = () => lsSet(LS.ui, st);
const fromRow = a => ({ date: a[0], cls: String(a[1]), no: Number(a[2]), aid: String(a[3]), value: a[4], grade: a[5], absent: !!a[6], note: a[7] || '', detail: a[8] || '' });
function apply(j) {
  S.cfg = j.cfg; S.classes = j.classes || {}; S.classOrder = j.classOrder || Object.keys(S.classes); S.scores = new Map();
  for (const a of j.scores || []) { const r = fromRow(a); S.scores.set(`${r.date}|${r.cls}|${r.no}|${r.aid}`, r); }
  S.ver++;
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
/* 放在 Apps Script 裡（個人部署）時走 google.script.run，由 Google 帳號把關；放在 GitHub 時走通行碼＋fetch。 */
const IN_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
function fetchBoot() {
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error((e && e.message) || String(e)))).adminBootstrap());
  const url = DEFAULT_API || auth.url;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'bootstrap', days: 400, key: auth.key }), signal: ctl.signal })
    .then(r => r.json()).finally(() => clearTimeout(to));
}
async function load(manual) {
  if (!IN_GAS && (!(DEFAULT_API || auth.url) || !auth.key)) { login(); return; }
  try {
    const j = await fetchBoot();
    if (j.error === 'auth') { login('通行碼不正確'); return; }
    if (!j.ok) throw new Error(j.error);
    apply(j); S.at = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }); render(); if (manual) toast('已更新');
  } catch (e) { toast('載入失敗：' + (e.name === 'AbortError' ? '逾時' : e.message) + (S.scores.size ? '（顯示本機快取）' : '')); if (!S.scores.size) $('#main').replaceChildren(h('div', { class: 'empty' }, IN_GAS ? '無法讀取資料：' + e.message : '連不上後端，請檢查網路後按 ↻。')); }
}
function login(msg) {
  const m = $('#modal'); m.hidden = false;
  const key = h('input', { type: 'password', placeholder: '教師通行碼', style: 'width:100%' });
  const err = h('div', { style: 'color:var(--g1);min-height:1.3em' }, msg || '');
  const go = () => { auth = { url: auth.url, key: key.value.trim() }; if (!auth.key) return; lsSet(LS.auth, auth); m.hidden = true; load(); };
  key.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  m.replaceChildren(h('div', { class: 'box' }, h('h2', { style: 'margin-top:0' }, '🔒 教師登入'), h('p', { class: 'note' }, '輸入與登記頁相同的通行碼。'), key, err, h('div', { style: 'text-align:right;margin-top:10px' }, h('button', { class: 'primary', onclick: go }, '進入'))));
  key.focus();
}

/* ════════ 分析核心 ════════ */
let memo = { key: '', val: null };
const acts = () => S.cfg.activities.filter(a => a.on);
function analyze(cls) {
  const key = [cls, st.from, st.to, st.mode, S.ver].join('|');
  const cached = analyze.c || (analyze.c = new Map());
  if (cached.get(cls) && cached.get(cls).key === key) return cached.get(cls).val;
  const roster = S.classes[cls] || [], aMap = new Map(acts().map(a => [a.id, a])), order = new Map(S.cfg.activities.map((a, i) => [a.id, i]));
  const stuMap = new Map(roster.map(([no, name]) => [no, { no, name, list: new Map() }]));
  const started = new Set(), byDate = new Map();
  for (const r of S.scores.values()) {
    if (r.cls !== cls) continue;
    const s = stuMap.get(r.no), a = aMap.get(r.aid); if (!s || !a) continue;
    if ((st.from && r.date < st.from) || (st.to && r.date > st.to)) continue;
    started.add(r.aid);
    let l = s.list.get(r.aid); if (!l) s.list.set(r.aid, l = []); l.push(r);
    if (r.grade != null) { let d = byDate.get(r.date); if (!d) byDate.set(r.date, d = []); d.push(scoreOf(a, r.grade)); }
  }
  const ci = c => { const i = S.cfg.categories.indexOf(c); return i < 0 ? 99 : i; };
  const actList = [...started].map(id => aMap.get(id)).sort((x, y) => ci(x.cat) - ci(y.cat) || order.get(x.id) - order.get(y.id));
  const cats = [...new Set(actList.map(a => a.cat))];
  const students = [...stuMap.values()].map(s => {
    s.cell = new Map(); s.abs = 0; s.pend = []; s.notes = [];
    for (const a of actList) {
      const l = (s.list.get(a.id) || []).sort((x, y) => x.date.localeCompare(y.date));
      const att = l.filter(r => r.grade != null), last = att[att.length - 1];
      s.abs += l.filter(r => r.absent).length;
      const la = [...l].reverse().find(r => r.absent);
      if (la && (!last || la.date > last.date)) s.pend.push({ act: a, date: la.date });
      for (const r of l) if (r.note) s.notes.push({ act: a, date: r.date, note: r.note });
      if (last) s.cell.set(a.id, { act: a, grade: last.grade, score: scoreOf(a, last.grade), rec: last, att, all: l });
    }
    const cells = [...s.cell.values()];
    s.catScore = new Map(cats.map(c => [c, mean(cells.filter(x => x.act.cat === c).map(x => x.score))]));
    const cs = [...s.catScore.values()].filter(v => v != null);
    s.total = st.mode === 'cat' ? mean(cs) : mean(cells.map(x => x.score));
    s.avgGrade = mean(cells.map(x => x.grade)); s.ones = cells.filter(x => x.grade === 1).length; s.n = cells.length;
    const deltas = cells.filter(x => x.att.length >= 2).map(x => x.att[x.att.length - 1].grade - x.att[0].grade);
    s.trend = deltas.length ? mean(deltas) : null;
    s.drops = cells.filter(x => x.att.length >= 2 && x.att[x.att.length - 1].grade <= x.att[x.att.length - 2].grade - 2).map(x => x.act);
    s.reasons = []; s.watch = [];
    if (s.n) {
      if (s.avgGrade < 2) s.reasons.push('整體偏低');
      if (s.ones >= Math.max(2, Math.ceil(s.n * 0.25))) s.reasons.push(`${s.ones} 項需加油`);
      if (s.drops.length >= 2) s.reasons.push(`${s.drops.length} 項明顯退步（如「${s.drops[0].name}」）`);
      else if (s.drops.length === 1) s.watch.push(`「${s.drops[0].name}」明顯退步`);
    }
    if (s.abs >= 4 || s.pend.length >= 3) s.reasons.push(`缺席 ${s.abs} 次${s.pend.length ? `（${s.pend.length} 項待補測）` : ''}`);
    s.flag = s.reasons.length > 0; s.watchOnly = !s.flag && s.watch.length > 0; s.star = s.n >= 3 && s.avgGrade >= 3.5 && s.ones === 0;
    return s;
  });
  const cellsAll = students.flatMap(s => [...s.cell.values()]);
  const totals = students.map(s => s.total).filter(v => v != null);
  const byAct = actList.map(a => {
    const cs = students.map(s => s.cell.get(a.id)).filter(Boolean);
    const dist = { 4: 0, 3: 0, 2: 0, 1: 0 }; cs.forEach(c => dist[c.grade]++);
    const missing = students.filter(s => !(s.list.get(a.id) || []).length);
    return { act: a, n: cs.length, avg: mean(cs.map(c => c.score)), rate: cs.length ? cs.filter(c => c.grade >= 3).length / cs.length : null, dist, missing };
  });
  const byCat = cats.map(c => ({ cat: c, avg: mean(students.map(s => s.catScore.get(c)).filter(v => v != null)), rate: (() => { const cs = cellsAll.filter(x => x.act.cat === c); return cs.length ? cs.filter(x => x.grade >= 3).length / cs.length : null; })() }));
  const series = [...byDate.entries()].sort((x, y) => x[0].localeCompare(y[0])).map(([date, v]) => ({ date, avg: mean(v), n: v.length }));
  const filled = students.reduce((n, s) => n + [...s.list.values()].filter(l => l.length).length, 0);
  const val = {
    cls, students, actList, cats, byAct, byCat, series, totals,
    avg: mean(totals), max: totals.length ? Math.max(...totals) : null, min: totals.length ? Math.min(...totals) : null,
    rate: cellsAll.length ? cellsAll.filter(c => c.grade >= 3).length / cellsAll.length : null,
    complete: students.length && actList.length ? filled / (students.length * actList.length) : null,
    flagged: students.filter(s => s.flag), watchers: students.filter(s => s.watchOnly), stars: students.filter(s => s.star), pend: students.reduce((n, s) => n + s.pend.length, 0),
    dist: { 4: cellsAll.filter(c => c.grade === 4).length, 3: cellsAll.filter(c => c.grade === 3).length, 2: cellsAll.filter(c => c.grade === 2).length, 1: cellsAll.filter(c => c.grade === 1).length }
  };
  cached.set(cls, { key, val });
  return val;
}

          h('td', { class: 'l note', style: 'max-width:260px' }, s.notes.map(n => `${md(n.date)} ${n.act.name}：${n.note}`).join('；')))),
          h('tr', null, h('td', { class: 's1' }, h('b', null, '全班平均')), A.cats.map(c => h('td', null, h('b', null, f1(A.byCat.find(x => x.cat === c).avg)))), h('td', null, h('b', null, f1(A.avg))), h('td'), h('td'))))),
      h('p', { class: 'note' }, '成績＝各活動「最近一次出席」的等級換算分數（優／達成／接近／需加油，預設 100／93／89／85，每個活動可在 Sheet「活動設定」的 優分～加油分欄自訂）；缺席不計分。'))
  ];
}

/* 學生詳情 */
function openDrawer(no) {
  const A = analyze(st.cls), s = A.students.find(x => x.no === no); if (!s) return;
  const d = $('#drawer');
  const bycat = A.cats.map(c => ({ c, items: A.actList.filter(a => a.cat === c) }));
  d.replaceChildren(
    h('div', { style: 'display:flex;align-items:center;gap:8px' }, h('h2', { style: 'flex:1;margin:0' }, `${s.no} 號 ${s.name}${s.star ? ' ⭐' : ''}`), h('button', { onclick: () => d.classList.remove('open'), 'aria-label': '關閉' }, '✕')),
    h('div', { class: 'chips', style: 'margin:8px 0' }, h('span', { class: 'pill' }, st.cls), h('span', { class: 'sc ' + band(s.total) }, `總分 ${f1(s.total)}`), h('span', { class: 'pill' }, `${s.n} 個活動`), s.reasons.map(r => h('span', { class: 'pill bad' }, r)), s.watch.map(r => h('span', { class: 'pill warn' }, r)), (!s.flag && !s.watch.length && s.n) ? h('span', { class: 'pill good' }, '表現穩定') : null),
    h('div', { style: 'text-align:center' }, radar(A.cats, A.cats.map(c => s.catScore.get(c)))),
    ...bycat.map(({ c, items }) => h('div', null, h('h3', { style: 'margin:12px 0 2px;font-size:1rem' }, c, ' ', sc(s.catScore.get(c))),
      items.map(a => { const cell = s.cell.get(a.id), l = s.list.get(a.id) || [];
        const tr = cell && cell.att.length >= 2 ? (() => { const g = cell.att.map(r => r.grade), dt = g[g.length - 1] - g[0]; return h('span', { class: dt > 0 ? 'up' : dt < 0 ? 'down' : 'flat' }, dt > 0 ? `↗ 進步 ${g.join('→')}` : dt < 0 ? `↘ 退步 ${g.join('→')}` : `→ 持平 ${g.join('→')}`); })() : null;
        return h('div', { class: 'dact' }, h('div', { class: 'hd' }, `${a.icon} ${a.name}`, cell ? sc(cell.score, ` ${LV[cell.grade]}`) : h('span', { class: 'pill' }, l.length ? '僅缺席' : '未登記'), tr),
          l.length ? h('div', { class: 'chips', style: 'margin-top:4px' }, l.map(r => h('span', { class: 'pill ' + (r.absent ? '' : 'g' + r.grade), title: r.note || '' }, md(r.date), ' ', r.absent ? '缺席' : `${r.value ?? ''}${a.mode === 'checklist' ? '項' : a.uom || ''} ${LV[r.grade]} ${scoreOf(a, r.grade)}`, r.note ? ' 📝' : ''))) : null,
          l.filter(r => r.note).map(r => h('div', { class: 'note' }, `${md(r.date)} 備註：${r.note}`)), s.pend.some(p => p.act.id === a.id) ? h('div', { class: 'pill warn', style: 'margin-top:4px' }, '缺席待補測') : null); }))));
  d.classList.add('open');
}

/* ════════ 繪製 ════════ */
function render() {
  if (!S.classOrder.includes(st.cls)) st.cls = S.classOrder[0] || '';
  clsSelect(); $('#fFrom').value = st.from; $('#fTo').value = st.to; $('#fMode').value = st.mode; $('#stamp').textContent = S.at ? `更新 ${S.at}` : '';
  $('#fCls').closest('.filters').querySelector('#fCls').style.display = st.tab === 'home' ? 'none' : '';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  const v = { home: viewHome, cls: viewCls, stu: viewStu, todo: viewTodo, report: viewReport }[st.tab];
  $('#main').replaceChildren(...[v()].flat().filter(Boolean));
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { $('#drawer').classList.remove('open'); go(b.dataset.tab); } });
$('#fCls').addEventListener('change', e => { st.cls = e.target.value; saveSt(); render(); });
$('#fFrom').addEventListener('change', e => { st.from = e.target.value; saveSt(); render(); });
$('#fTo').addEventListener('change', e => { st.to = e.target.value; saveSt(); render(); });
$('#fMode').addEventListener('change', e => { st.mode = e.target.value; saveSt(); render(); });
$('#btnRefresh').addEventListener('click', () => load(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });

(function init() {
  if (IN_GAS) { const back = document.querySelector('header a'); if (back) back.hidden = true; }
  const c = IN_GAS ? null : lsGet(LS.cache, null);
  if (c && c.cfg) { apply({ cfg: c.cfg, classes: c.classes, classOrder: c.classOrder, scores: c.scores }); S.at = '本機快取'; }
  render(); load();
})();
window.__admin = { S, st, analyze, render, go };
})();
</script>
